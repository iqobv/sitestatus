services:
  database:
    container_name: sitestatus_db
    image: postgres:18.3
    restart: "no"
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - sitestatus_network
    volumes:
      - postgres-data:/var/lib/postgresql

  sqlserver:
    container_name: sitestatus_sql
    image: mcr.microsoft.com/mssql/server:2022-CU25-ubuntu-22.04
    restart: "no"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    networks:
      - sitestatus_network

  servicebus-emulator:
    container_name: sitestatus_sb_emulator
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    restart: "no"
    volumes:
      - ./sb-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    depends_on:
      - sqlserver
    networks:
      - sitestatus_network

  turso-local:
    image: ghcr.io/tursodatabase/libsql-server:d6c75af
    restart: "no"
    container_name: turso_local
    ports:
      - "8080:8080"
    environment:
      - SQLD_NODE=primary
    volumes:
      - turso_data:/var/lib/sqld

volumes:
  postgres-data:
  servicebus-data:
  turso_data:

networks:
  sitestatus_network:
